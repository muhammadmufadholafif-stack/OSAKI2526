<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>iPhone Home Screen</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Font Awesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sf: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            'ios-glass': 'rgba(255, 255, 255, 0.16)',
            'ios-dock': 'rgba(40, 42, 48, 0.45)',
          },
          backdropBlur: {
            'ios': '30px',
            'dock': '35px',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom iOS Theme Styling -->
<style data-purpose="custom-styling">
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* iOS App Icon Squircle Radius */
    .ios-squircle {
      border-radius: 22.37%;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* iOS Widget Squircle Radius */
    .ios-widget-shape {
      border-radius: 24px;
    }

    /* Realistic blurred wallpaper matching panel 2 mood */
    .ios-wallpaper {
      background: radial-gradient(circle at 60% 30%, #4a3429 0%, #201b1b 50%, #0d0f12 100%),
                  linear-gradient(180deg, rgba(20, 20, 25, 0.7) 0%, rgba(10, 10, 15, 0.95) 100%);
    }

    .ambient-glow {
      background: radial-gradient(circle at 75% 25%, rgba(205, 120, 75, 0.28) 0%, rgba(0,0,0,0) 60%),
                  radial-gradient(circle at 20% 70%, rgba(45, 65, 100, 0.25) 0%, rgba(0,0,0,0) 50%);
    }
  </style>
<!-- END: Custom iOS Theme Styling -->
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen p-0 sm:p-4 overflow-hidden">
<!-- BEGIN: PhoneFrame -->
<div class="relative w-full max-w-[393px] h-[852px] bg-black sm:rounded-[54px] overflow-hidden shadow-2xl flex flex-col justify-between border-0 sm:border-[8px] sm:border-[#2a2a2c]" data-purpose="phone-viewport">
<!-- Atmospheric Blurred Wallpaper -->
<div class="absolute inset-0 ios-wallpaper pointer-events-none z-0"></div>
<div class="absolute inset-0 ambient-glow pointer-events-none z-0"></div>
<!-- BEGIN: StatusBar -->
<header class="relative z-30 pt-3 px-7 flex justify-between items-center text-white text-[15px] font-semibold tracking-tight" data-purpose="status-bar">
<!-- Time -->
<div class="w-14 pl-1 text-left font-sf">07:51</div>
<!-- Dynamic Island Area -->
<div class="w-[124px] h-[34px] bg-black rounded-full flex items-center justify-between px-3 shadow-inner" data-purpose="dynamic-island">
<div class="w-3 h-3 rounded-full bg-[#0a0a0f] border border-[#1a1a24]"></div>
<div class="w-2.5 h-2.5 rounded-full bg-[#0c1427]/80"></div>
</div>
<!-- System Status Icons -->
<div class="w-14 flex items-center justify-end space-x-1.5 text-xs text-white">
<!-- Signal -->
<i class="fa-solid fa-signal text-[11px]"></i>
<!-- 5G / Wifi -->
<i class="fa-solid fa-wifi text-[11px]"></i>
<!-- Battery with fill -->
<div class="w-[22px] h-[11px] border border-white/80 rounded-[3px] p-[1px] flex items-center relative">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
<div class="absolute -right-[3px] top-[2.5px] w-[2px] h-[4px] bg-white/80 rounded-r-[1px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: MainContent -->
<main class="relative z-10 flex-1 flex flex-col px-5 pt-3" data-purpose="home-screen-content">
<!-- BEGIN: WidgetsRow -->
<section class="grid grid-cols-2 gap-4 mt-2" data-purpose="widgets-row">
<!-- Left Widget: Calendar (Dark Theme) -->
<div class="ios-widget-shape h-[155px] bg-[#1c1c1e]/80 backdrop-blur-xl border border-white/5 p-4 flex flex-col justify-between shadow-lg relative overflow-hidden" data-purpose="calendar-widget">
<div>
<span class="text-red-500 font-semibold text-[13px] tracking-tight block">Thursday</span>
<span class="text-white text-5xl font-light tracking-tighter leading-tight block mt-0.5">22</span>
</div>
<div class="flex items-center space-x-1.5 text-white/50 text-[11px] pb-1">
<span class="inline-block w-2 h-2 rounded-full bg-red-500/80"></span>
<span class="truncate">No more events</span>
</div>
</div>
<!-- Right Widget: Weather (Sky Blue) -->
<div class="ios-widget-shape h-[155px] bg-gradient-to-b from-[#2b5993] to-[#1e3c66] backdrop-blur-xl border border-white/10 p-4 flex flex-col justify-between shadow-lg relative overflow-hidden" data-purpose="weather-widget">
<div class="flex justify-between items-start">
<div>
<div class="flex items-center text-white/90 text-xs font-semibold space-x-1">
<span>Weather</span>
<i class="fa-solid fa-arrow-up-right-from-square text-[9px] opacity-70"></i>
</div>
<div class="text-3xl font-light text-white mt-1">--°</div>
</div>
<!-- Weather Symbol -->
<div class="text-white/90 text-2xl pt-0.5 pr-1">
<i class="fa-solid fa-cloud"></i>
</div>
</div>
<div>
<p class="text-white/70 text-[11px] leading-tight font-medium">No forecast added</p>
</div>
</div>
</section>
<!-- END: WidgetsRow -->
<!-- BEGIN: AppGridRow -->
<!-- Row of 4 Icons matching prompt requirement -->
<section class="grid grid-cols-4 gap-4 mt-6 px-1 text-center" data-purpose="app-icons-row">
<!-- App 1: WhatsApp -->
<div class="flex flex-col items-center cursor-pointer group active:scale-95 transition-transform" data-purpose="app-icon-item">
<div class="w-[60px] h-[60px] ios-squircle bg-[#25D366] flex items-center justify-center text-white text-3xl shadow-md">
<i class="fa-brands fa-whatsapp"></i>
</div>
<span class="text-white text-[11px] font-medium tracking-tight mt-1.5 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">WhatsApp</span>
</div>
<!-- App 2: Spotify -->
<div class="flex flex-col items-center cursor-pointer group active:scale-95 transition-transform" data-purpose="app-icon-item">
<div class="w-[60px] h-[60px] ios-squircle bg-black flex items-center justify-center shadow-md border border-white/5">
<div class="w-[46px] h-[46px] rounded-full bg-[#1DB954] flex items-center justify-center text-black text-2xl">
<i class="fa-brands fa-spotify text-black text-[28px]"></i>
</div>
</div>
<span class="text-white text-[11px] font-medium tracking-tight mt-1.5 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">Spotify</span>
</div>
<!-- App 3: Galeri (Photos flower icon) -->
<div class="flex flex-col items-center cursor-pointer group active:scale-95 transition-transform" data-purpose="app-icon-item">
<div class="w-[60px] h-[60px] ios-squircle bg-white flex items-center justify-center shadow-md relative overflow-hidden">
<!-- Colorful Petals Graphic -->
<div class="relative w-8 h-8 flex items-center justify-center">
<span class="absolute w-2 h-4 bg-amber-400 rounded-full top-0 opacity-90"></span>
<span class="absolute w-2 h-4 bg-orange-500 rounded-full top-0.5 right-1 rotate-45 opacity-90"></span>
<span class="absolute w-2 h-4 bg-red-500 rounded-full right-0 rotate-90 opacity-90"></span>
<span class="absolute w-2 h-4 bg-pink-500 rounded-full bottom-0.5 right-1 rotate-[135deg] opacity-90"></span>
<span class="absolute w-2 h-4 bg-purple-500 rounded-full bottom-0 rotate-180 opacity-90"></span>
<span class="absolute w-2 h-4 bg-blue-500 rounded-full bottom-0.5 left-1 rotate-[225deg] opacity-90"></span>
<span class="absolute w-2 h-4 bg-cyan-400 rounded-full left-0 rotate-[270deg] opacity-90"></span>
<span class="absolute w-2 h-4 bg-emerald-400 rounded-full top-0.5 left-1 rotate-[315deg] opacity-90"></span>
</div>
</div>
<span class="text-white text-[11px] font-medium tracking-tight mt-1.5 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">Galeri</span>
</div>
<!-- App 4: Hadiah (Orange gift box icon, dimmed with padlock) -->
<div class="flex flex-col items-center cursor-pointer group active:scale-95 transition-transform" data-purpose="app-icon-item">
<div class="w-[60px] h-[60px] ios-squircle bg-gradient-to-tr from-[#ea580c] to-[#f97316] flex items-center justify-center text-white text-2xl shadow-md relative opacity-80 brightness-90">
<!-- Gift Icon -->
<i class="fa-solid fa-gift text-white/95 text-[26px]"></i>
<!-- Small Padlock Badge at top-right corner -->
<div class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#18181b] border border-white/20 flex items-center justify-center text-[10px] text-amber-400 shadow-md">
<i class="fa-solid fa-lock text-[9px]"></i>
</div>
</div>
<span class="text-white text-[11px] font-medium tracking-tight mt-1.5 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">Hadiah</span>
</div>
</section>
<!-- END: AppGridRow -->
<!-- Center Spacer -->
<div class="flex-1"></div>
<!-- BEGIN: SearchPill -->
<!-- iOS Search Capsule Button -->
<div class="flex justify-center mb-4" data-purpose="search-indicator">
<button class="flex items-center space-x-1.5 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md border border-white/10 text-white/90 text-xs font-normal shadow-sm active:scale-95 transition-transform">
<i class="fa-solid fa-magnifying-glass text-[10px] opacity-80"></i>
<span class="tracking-tight">Search</span>
</button>
</div>
<!-- END: SearchPill -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: DockContainer -->
<footer class="relative z-20 px-4 pb-3" data-purpose="floating-dock-container">
<!-- Translucent Frosted Glass Dock -->
<div class="w-full h-[88px] bg-white/20 backdrop-blur-dock rounded-[35px] border border-white/15 px-4 flex items-center justify-between shadow-2xl" data-purpose="floating-dock">
<!-- Dock App 1: Phone -->
<div class="w-[58px] h-[58px] ios-squircle bg-gradient-to-b from-[#34D399] to-[#059669] flex items-center justify-center text-white text-2xl shadow-md active:scale-90 transition-transform cursor-pointer">
<i class="fa-solid fa-phone text-white text-[24px]"></i>
</div>
<!-- Dock App 2: Safari -->
<div class="w-[58px] h-[58px] ios-squircle bg-white flex items-center justify-center shadow-md active:scale-90 transition-transform cursor-pointer relative overflow-hidden">
<div class="w-12 h-12 rounded-full border border-sky-400/40 flex items-center justify-center relative">
<!-- Compass needle -->
<div class="w-1.5 h-10 bg-gradient-to-b from-red-500 via-white to-red-500 transform rotate-45 rounded-sm shadow-sm"></div>
<div class="absolute w-2 h-2 rounded-full bg-white border border-gray-400"></div>
</div>
</div>
<!-- Dock App 3: WhatsApp / Messages -->
<div class="w-[58px] h-[58px] ios-squircle bg-[#25D366] flex items-center justify-center text-white text-2xl shadow-md active:scale-90 transition-transform cursor-pointer">
<i class="fa-brands fa-whatsapp text-white text-[28px]"></i>
</div>
<!-- Dock App 4: Music -->
<div class="w-[58px] h-[58px] ios-squircle bg-gradient-to-tr from-[#fa2d48] to-[#fb6578] flex items-center justify-center text-white text-2xl shadow-md active:scale-90 transition-transform cursor-pointer">
<i class="fa-solid fa-music text-white text-[23px]"></i>
</div>
</div>
<!-- Home Swipe Indicator Bar -->
<div class="flex justify-center pt-3 pb-1" data-purpose="home-indicator">
<div class="w-[134px] h-[5px] bg-white/70 rounded-full"></div>
</div>
</footer>
<!-- END: DockContainer -->
</div>
<!-- END: PhoneFrame -->
</body></html>
