<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>08. Galeri Foto - iOS Simulator</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'sans-serif'],
          },
          colors: {
            iosDark: '#000000',
            iosGray: '#1C1C1E',
            iosLightGray: '#2C2C2E',
            iosBlue: '#0A84FF',
          }
        }
      }
    }
  </script>
<!-- Custom Styles -->
<style data-purpose="custom-scroll-and-effects">
    /* Hide scrollbar for clean mobile preview */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Dynamic blur pill effect */
    .glass-pill {
      background: rgba(44, 44, 46, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-nav {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-0 sm:p-4 select-none font-sans">
<!-- BEGIN: PhoneFrameContainer -->
<!-- 9:16 mobile aspect ratio screen container mimicking iPhone style from reference -->
<div class="relative w-full max-w-[400px] h-[844px] bg-black rounded-[48px] overflow-hidden border-[6px] border-zinc-800 shadow-2xl flex flex-col justify-between" data-purpose="mobile-device-simulator">
<!-- BEGIN: DynamicIslandAndStatusBar -->
<!-- Top System Header: Status Bar & Island -->
<header class="relative z-50 pt-3 px-7 flex flex-col w-full bg-black/80 backdrop-blur-md">
<!-- Status bar row -->
<div class="flex justify-between items-center text-xs font-semibold text-white tracking-tight h-5">
<!-- Time -->
<span class="text-[14px] font-semibold pl-1">07:55</span>
<!-- Center Dynamic Island pill -->
<div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-[105px] h-[28px] bg-black rounded-full flex items-center justify-end pr-2.5 space-x-1 border border-zinc-900/60 shadow-inner" data-purpose="dynamic-island">
<div class="w-2.5 h-2.5 rounded-full bg-neutral-900/90 ring-1 ring-neutral-800"></div>
<div class="w-2 h-2 rounded-full bg-emerald-500/80 animate-pulse"></div>
</div>
<!-- Icons right (5G, Wi-Fi, Battery) -->
<div class="flex items-center space-x-1.5 pr-0.5">
<span class="text-[11px] font-semibold tracking-tighter">5G</span>
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.67 0 7 1.45 9.47 3.82L12 19.12 2.53 11.32C5 8.95 8.33 7.5 12 7.5z"></path>
</svg>
<!-- Battery Container -->
<div class="flex items-center space-x-0.5">
<div class="w-5 h-2.5 border border-white/70 rounded-[3px] p-[1px] flex items-center">
<div class="bg-white h-full w-[88%] rounded-[1.5px]"></div>
</div>
<div class="w-0.5 h-1 bg-white/60 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- END: Status bar row -->
</header>
<!-- END: DynamicIslandAndStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<!-- App Bar with "< Home" pill button and Select action -->
<div class="px-4 pt-2 pb-2 flex items-center justify-between z-40 bg-black" data-purpose="navigation-header">
<!-- Back pill button matching reference (< Home) -->
<button class="flex items-center space-x-1 text-white text-[13px] font-medium bg-[#1F1F21]/80 hover:bg-neutral-800 px-3 py-1 rounded-full border border-white/10 transition-all">
<svg class="w-4 h-4 -ml-1 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Home</span>
</button>
<!-- Select Button -->
<button class="text-iosBlue text-[14px] font-semibold hover:opacity-80 px-2 py-1">
        Pilih
      </button>
</div>
<!-- END: TopNavigationBar -->
<!-- BEGIN: MainContentArea -->

<button class="bg-white text-black font-semibold px-3 py-1.5 rounded-full shadow-sm">
            Semua Foto

<button class="bg-[#1C1C1E] text-neutral-300 hover:text-white px-3 py-1.5 rounded-full border border-white/5">
            Album

<button class="bg-[#1C1C1E] text-neutral-300 hover:text-white px-3 py-1.5 rounded-full border border-white/5">

<button class="bg-[#1C1C1E] text-neutral-300 hover:text-white px-3 py-1.5 rounded-full border border-white/5">
