<script>
  // Micro-interactions for authentic iOS Control Center feel
  const playBtn = document.getElementById('btn-play');
  const playIcon = document.getElementById('icon-play');
  let isPlaying = true;
  if (playBtn && playIcon) {
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
    });
  }

  const flashBtn = document.getElementById('btn-flashlight');
  let flashActive = true;
  if (flashBtn) {
    flashBtn.addEventListener('click', () => {
      flashActive = !flashActive;
      if (flashActive) {
        flashBtn.className = 'aspect-square bg-inverse-surface text-inverse-on-surface rounded-lg flex items-center justify-center active:scale-90 transition-all shadow-xl shadow-primary-container/20';
        flashBtn.innerHTML = '<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: \'FILL\' 1;">flashlight_on</span>';
      } else {
        flashBtn.className = 'aspect-square bg-surface-container/70 backdrop-blur-2xl text-on-surface rounded-lg flex items-center justify-center active:scale-90 transition-all shadow-xl';
        flashBtn.innerHTML = '<span class="material-symbols-outlined text-[26px]">flashlight_off</span>';
      }
    });
  }

  const wifiBtn = document.getElementById('btn-wifi');
  let wifiActive = true;
  if (wifiBtn) {
    wifiBtn.addEventListener('click', () => {
      wifiActive = !wifiActive;
      if (wifiActive) {
        wifiBtn.className = 'aspect-square rounded-full bg-primary-container text-on-primary-container flex items-center justify-center transition-all active:scale-90 shadow-md';
      } else {
        wifiBtn.className = 'aspect-square rounded-full bg-surface-variant/80 text-on-surface flex items-center justify-center transition-all active:scale-90';
      }
    });
  }
