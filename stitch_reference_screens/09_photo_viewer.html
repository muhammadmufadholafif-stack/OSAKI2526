<!-- Interactive JavaScript Hook for UI Haptics & Heart Reaction -->
<script>
    (function() {
      const favBtn = document.getElementById('favorite-btn');
      const favIcon = document.getElementById('favorite-icon');
      const burst = document.getElementById('heart-burst');
      let liked = true;

      if (favBtn && favIcon) {
        favBtn.addEventListener('click', function() {
          liked = !liked;
          if (liked) {
            favIcon.style.fontVariationSettings = "'FILL' 1";
            favBtn.className = "w-10 h-10 rounded-full bg-surface-container-high/80 flex items-center justify-center text-primary active:scale-90 transition-transform";
            if (burst) {
              burst.classList.remove('opacity-0', 'scale-50');
              burst.classList.add('opacity-90', 'scale-110');
              setTimeout(() => {
                burst.classList.remove('opacity-90', 'scale-110');
                burst.classList.add('opacity-0', 'scale-50');
              }, 450);
            }
          } else {
            favIcon.style.fontVariationSettings = "'FILL' 0";
            favBtn.className = "w-10 h-10 rounded-full bg-surface-container-high/80 flex items-center justify-center text-on-surface-variant active:scale-90 transition-transform";
          }
        });
      }
    })();
